<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SJS Entrance Test</title>
<meta name="theme-color" content="#1d3fb8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: formal, proud school office — clear, trustworthy, quick to use on a phone
   IDEA: the school notice board result sheet — crest, blue ribbon, merit list
   PICTURE: the live class-wise result bars and the A4 notice preview
   COLOUR and TYPE: royal blue field, white, ink; crest red for what matters; Outfit + Inter
   LAYOUT: blue band header with tabs; each tab one working tool; tables scroll on phones */
:root{color-scheme:light dark;--bg:light-dark(#f3f5fb,#0b1120);--card:light-dark(#ffffff,#141c31);--ink:light-dark(#111a33,#e8ecf8);--mute:light-dark(#5a6584,#9aa5c4);--line:light-dark(#dfe4f0,#26304c);--soft:light-dark(#eef2fc,#1a2542);--blue:#1d3fb8;--blueD:light-dark(#142d86,#8fa8ff);--red:#d8342b;--green:light-dark(#12805c,#4cd29f);--greenS:light-dark(#e3f5ed,#123528);--amber:light-dark(#a35f00,#f2b54b);--amberS:light-dark(#fff1d6,#3a2a0c);--redS:light-dark(#fde7e5,#3d1614);--greyS:light-dark(#f1f3f8,#1c2438)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.hero{background:var(--blue);color:#fff;padding:18px max(4vw,14px) 0;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red)}
.brand{display:flex;gap:14px;align-items:center;max-width:1240px;margin:0 auto}
.crest{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font:700 20px Outfit,sans-serif;box-shadow:inset 0 0 0 3px var(--blue),inset 0 0 0 5px #fff,0 4px 14px #0003}
.brand h1{font-size:clamp(20px,3.4vw,30px);letter-spacing:.01em}
.brand p{margin:2px 0 0;opacity:.85;font-size:14px}
.sync{margin-left:auto;font-size:12.5px;background:#ffffff22;color:#fff;text-decoration:none;padding:6px 11px;border-radius:99px;white-space:nowrap}
.logo{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;object-fit:contain;padding:3px;box-shadow:0 4px 14px #0003}
.backapp{flex:none;color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#ffffff1f;margin-right:-4px}
.a4 .hd img{width:54px;height:54px;object-fit:contain}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1240px;margin:14px auto 0;scrollbar-width:none;padding-bottom:3px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:#fff;text-decoration:none;padding:11px 14px;border-radius:10px 10px 0 0;font-weight:600;font-size:14px;opacity:.82;min-height:44px}
.tabs a.on{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:1240px;margin:0 auto;padding:22px max(4vw,14px) 60px}
.banner{background:var(--amberS);color:var(--amber);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card h3{font-size:18px;margin-bottom:12px}
.lede{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.lede h2{font-size:clamp(24px,3.6vw,38px)}
.lede p{margin:6px 0 0;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font:700 clamp(24px,3vw,30px)/1.1 Outfit,sans-serif;color:var(--blueD)}
.kpi span{font-size:13px;color:var(--mute)}
.kpi.g b{color:var(--green)}.kpi.a b{color:var(--amber)}.kpi.r b{color:var(--red)}
.kpi.g{background:var(--greenS)}.kpi.a{background:var(--amberS)}.kpi.r{background:var(--redS)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:78px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:22px;border-radius:6px;background:var(--greyS);display:flex;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar .n{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.c-sel{background:#12a06e}.c-wl{background:#f0a020}.c-q{background:#6d8cf0}.c-nq{background:#e2534a}.c-ab{background:#9aa3bb}.c-pen{background:#cfd5e4}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--soft);color:var(--blueD);text-align:left;font-weight:600;font-size:12.5px;padding:9px 8px;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.c,th.c{text-align:center}
.scroll{overflow-x:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-sel{background:var(--greenS);color:var(--green)}.p-wl{background:var(--amberS);color:var(--amber)}.p-nq{background:var(--redS);color:var(--red)}.p-q{background:var(--soft);color:var(--blueD)}.p-ab,.p-pen{background:var(--greyS);color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:14px}
.tools label{display:grid;gap:3px;font-size:12.5px;color:var(--mute)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;font-size:16px}
textarea{width:100%;min-height:110px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:10px 15px;min-height:44px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--blueD);white-space:nowrap}
.btn.pri{background:var(--blue);color:#fff}.btn.red{background:var(--redS);color:var(--red)}.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.form label.wide{grid-column:1/-1}
.mk input{width:66px;min-height:38px;padding:6px;text-align:center;font-size:15px}
.mk input.bad{border-color:var(--red);background:var(--redS)}
.mk td{padding:5px 6px}.mk td:first-child,td b{white-space:nowrap}
.mk tr.abs td{opacity:.55}
.chk{width:22px;height:22px;min-height:0}
.a4wrap{background:var(--greyS);border-radius:14px;padding:16px;overflow:auto}
.a4{background:#fff;color:#111a33;width:100%;max-width:794px;margin:0 auto;padding:28px 34px;box-shadow:0 6px 24px #0002;font-size:12px;border-top:6px solid #1d3fb8}
.a4 .hd{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;border-bottom:2px solid #1d3fb8;padding-bottom:8px}
.a4 .hd .crest{width:50px;height:50px;font-size:18px;background:#1d3fb8;color:#fff;box-shadow:inset 0 0 0 3px #1d3fb8,inset 0 0 0 4px #fff}
.a4 .hd div{text-align:center}.a4 .hd b{font:700 20px Outfit,sans-serif;color:#142d86;display:block}.a4 .hd small{display:block;color:#5a6584;font-size:10.5px}
.a4 .rib{display:block;width:fit-content;margin:12px auto 4px;background:#1d3fb8;color:#fff;border-radius:99px;padding:5px 22px;font-weight:700;letter-spacing:.03em;font-size:13px}
.a4 .sub{text-align:center;color:#5a6584;font-size:11px;margin-bottom:10px}
.a4 table{font-size:11.5px}.a4 th{background:#1d3fb8;color:#fff;font-size:10.5px;padding:6px}.a4 td{padding:5px 6px;border-color:#e3e7f1}
.a4 h4{margin:14px 0 6px;font-size:13px;border-left:4px solid #12805c;padding-left:8px}
.a4 .note{background:#eef2fc;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:11px}
.a4 .sig{display:flex;justify-content:space-between;margin-top:40px;font-weight:700;font-size:11px}.a4 .sig span{border-top:1px solid #111a33;padding-top:4px;width:150px;text-align:center}
.a4 .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;border:1px solid #dfe4f0;border-radius:10px;padding:12px;margin:10px 0}
.a4 .kv small{display:block;font-size:9px;font-weight:700;color:#5a6584;text-transform:uppercase}
.a4 .res{border-radius:10px;padding:12px 16px;margin:12px 0;font:700 18px Outfit,sans-serif}
.muted{color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top10 li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.top10{list-style:none;margin:0;padding:0}
.top10 em{font-style:normal;font-weight:700;color:var(--blueD);font-variant-numeric:tabular-nums}
.rk{width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--blueD);display:grid;place-items:center;font-size:12px;font-weight:700}
.top10 li:nth-child(-n+3) .rk{background:var(--red);color:#fff}
#modal{position:fixed;inset:0;background:#0a1020aa;display:none;place-items:center;padding:14px;z-index:20}
#modal.on{display:grid}
#modal .box{background:var(--card);border-radius:16px;padding:20px;width:min(760px,100%);max-height:92vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111a33;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
@media(prefers-reduced-motion:no-preference){.bar .t i{transition:width .5s ease}}
@media(max-width:600px){.brand h1{font-size:19px}.brand p{font-size:12px}.logo{width:42px;height:42px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-size:12px}.stack td:empty{display:none}.bar{grid-template-columns:62px minmax(0,1fr) 52px}.sync{display:none}.a4{padding:16px}}
@media print{.hero,.tools,.noprint,#toast{display:none!important}main{padding:0}.a4wrap{background:none;padding:0}.a4{box-shadow:none;max-width:none}@page{size:A4;margin:12mm}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

async function liveStart(interactive){

  const auth=firebase.auth();

  if(!u){if(!interactive){Live.state='off';paintLive();return;}
    u=await loginDialog(auth);if(!u){Live.state='off';paintLive();return;}}
  Live.user=u;await roleInit(u);
  let snap;try{snap=await mainRef().get();}catch(e){liveFail(e);return;}

    if(!Live.mgr){Live.state='notstarted';paintLive();if(interactive)toast('Online sharing has not been started yet. The Admin or Exam In-Charge must start it first.');if(curView()==='backup')route();return;}
    if(!interactive){Live.state='notstarted';paintLive();return;}
    const opts=S.sample?[['upload','Upload sample too'],['empty','Start with no candidates']]:[['upload','Upload and share']];
    const ch=await choose('Start online sharing?','No shared entrance-test data exists yet. Upload the setup'+(S.sample?' (school, test, seats, subjects)':' and candidates')+' from this device so every SJS App login sees the same results?',opts);

function unsubAll(){Live.unsub.forEach(f=>{try{f();}catch(e){}});Live.unsub=[];}
function subscribe(){
  unsubAll();const main=mainRef();
  Live.unsub.push(main.onSnapshot(d=>{if(!d.exists||Live.meta||Live.full)return;const m=d.data()||{};
    const n=normalize({school:m.school,test:m.test,classes:m.classes,cands:[]});
    S.school=n.school;S.test=n.test;S.classes=n.classes;S.seq=m.seq||{};S.sample=!!m.sample;S.teachersMarks=!!m.teachersMarks;afterRemote();},e=>liveFail(e)));
  Live.unsub.push(main.collection('c').onSnapshot(snap=>{if(Live.full)return;let ch=false;
    snap.docChanges().forEach(c=>{applyClass(c.doc.id,c.type==='removed'?{}:((c.doc.data()||{}).cands||{}));ch=true;});if(ch)afterRemote();},e=>liveFail(e)));
}
function applyClass(code,map){
  const dirty=Live.dirty[code]||new Set(),del=Live.del[code]||new Set();
  const keep=S.cands.filter(k=>k.cls!==code||dirty.has(k.id));const ids=new Set(keep.map(k=>k.id));
  const inc=normalize({cands:Object.values(map).filter(k=>k&&k.id&&!ids.has(k.id)&&!del.has(k.id)).map(k=>Object.assign({},k,{cls:code}))}).cands;
  S.cands=keep.concat(inc);
}

}

  const bars=R.order.map(c=>{const s=R.by[c].stats;return `<div class="bar"><span>${esc(clsName(c).replace('Class ',''))}</span><div class="t" title="${esc(clsName(c))}">${segs(s).map(x=>x[1]?`<i class="${x[0]}" style="width:${x[1]*100/maxA}%"></i>`:'').join('')}</div><span class="n">${s.sel}/${s.seats} · ${s.applied}</span></div>`;}).join('');

  <div class="row noprint"><button class="btn pri" data-a="sumpdf">Summary report PDF</button><button class="btn" data-a="allxls">Full result Excel</button></div></div>

   ${Live.on&&Live.mgr?`<label class="row" style="margin-top:14px"><input type="checkbox" class="chk" id="tmarks" ${S.teachersMarks?'checked':''}> <span><b>Teachers can enter marks</b> — every confirmed SJS App teacher may type marks (only the Admin and Exam In-Charge change setup and candidates).</span></label>`:''}
   <p class="muted" style="font-size:13px;margin-bottom:0">Uses the same logins as SJS App (Staff ID or email + password). If you are already signed in to SJS App on this phone, it connects by itself. Admin and Exam In-Charge: full access · Principal and teachers: view only (or marks entry when allowed).</p></div>
  ${!Live.on||Live.admin?`<details class="card"><summary><b>One-time Firebase setup (Admin)</b></summary><p class="muted">In Firebase console → Firestore Database → Rules, paste this block just above the last two closing braces <code>}</code> <code>}</code>, then Publish.</p><pre style="background:var(--soft);padding:12px;border-radius:10px;overflow:auto;font-size:12px">${esc(RULES_TXT)}</pre><button class="btn" data-a="copyrules">Copy rules</button></details>`:''}
  <div class="grid2"><div class="card"><h3>How it works</h3><ol class="steps"><li><span><b>Setup</b> — check school details, test date, seats, waiting list, qualifying % and subjects for each class.</span></li><li><span><b>Candidates</b> — add each applicant (or paste a list from Excel). Roll numbers like NUR-001 are given automatically.</span></li><li><span><b>Admit cards</b> — print two per A4 sheet before the test; print a blank award list for examiners.</span></li><li><span><b>Marks entry</b> — type marks or tick Absent. Total, %, grade, rank, selection and waiting list are worked out at once.</span></li><li><span><b>Notice board / Results / Score cards</b> — download A4 PDF or Excel for the notice board, file copy and parents.</span></li></ol></div>
  <div class="card"><h3>Keep your data safe</h3><p class="muted">Download a backup file regularly, especially before clearing data or changing devices.</p>
   <div class="row"><button class="btn pri" data-a="bkp">Download backup (.json)</button>${canEdit()?'<label class="btn" style="display:inline-flex;align-items:center">Restore backup<input type="file" id="restore" accept=".json,application/json" hidden></label>':''}</div>
   ${canEdit()?`<h3 style="margin-top:20px">Start fresh</h3><div class="row"><button class="btn red" data-a="clear">Clear all candidates</button><button class="btn" data-a="sample">Load sample data</button></div>
   <p class="muted" style="font-size:13px">Clearing keeps your school details, test details, seats and subjects.${Live.on?' <b>Online: this changes the data for everyone.</b>':''}</p>`:''}</div></div>`;
}
/* ---------- ROUTER ---------- */
const curView=()=>{const v=(location.hash||'#dashboard').slice(1);return VIEWS[v]?v:'dashboard';};
const VIEWS={dashboard:vDashboard,candidates:vCandidates,marks:vMarks,results:vResults,notice:vNotice,scorecards:vScore,admit:vAdmit,setup:vSetup,backup:vBackup};
function route(){
  const v=(location.hash||'#dashboard').slice(1);const view=VIEWS[v]?v:'dashboard';
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+view));
  header();$('#app').innerHTML=VIEWS[view]();if(view==='marks')refreshMarks();
}
window.addEventListener('hashchange',()=>{ui.q='';route();window.scrollTo(0,0);});

/* ---------- EVENTS ---------- */
const actions={
  sumpdf:()=>saveFile('Entrance_Summary_'+fn(S.test.session)+'.pdf',summaryPDF(S,R),'application/pdf'),
  allxls:()=>xlsOut([summarySheet(S,R),candidatesSheet(S,R)].concat(R.order.filter(c=>R.by[c].stats.applied).map(c=>classResultSheet(S,R,c))),'Entrance_Result_All_Classes_'+fn(S.test.session)+'.xlsx'),
  candxls:()=>xlsOut([candidatesSheet(S,R)],'Entrance_Candidates_Register_'+fn(S.test.session)+'.xlsx'),
  add:()=>candForm(null),bulk:bulkForm,
  award:()=>pdfOut(awardPDF(S,R,ui.cls),'Award_List_'+fn(clsName(ui.cls))+'.pdf'),
  respdf:()=>pdfOut(resultPDF(S,R,[ui.rcls]),'Result_Sheet_'+fn(clsName(ui.rcls))+'.pdf'),
  resxls:()=>xlsOut([classResultSheet(S,R,ui.rcls),meritSheet(S,R,ui.rcls)],'Result_'+fn(clsName(ui.rcls))+'_'+fn(S.test.session)+'.xlsx'),
  allpdf:()=>pdfOut(resultPDF(S,R,R.order.filter(c=>R.by[c].stats.applied)),'Result_Sheets_All_Classes.pdf'),
  notpdf:()=>{const codes=ui.ncls?[ui.ncls]:R.order.filter(c=>R.by[c].stats.applied);pdfOut(noticePDF(S,R,codes,{marks:ui.nmarks,father:ui.nfather,wait:ui.nwait}),'Notice_Board_Result_'+(ui.ncls?fn(clsName(ui.ncls)):'All_Classes')+'.pdf');},
  notxls:()=>{const codes=ui.ncls?[ui.ncls]:R.order.filter(c=>R.by[c].stats.applied);xlsOut(codes.map(c=>meritSheet(S,R,c,{marks:ui.nmarks,father:ui.nfather,wait:ui.nwait})),'Notice_Board_Result_'+(ui.ncls?fn(clsName(ui.ncls)):'All_Classes')+'.xlsx');},
  print:()=>{try{window.print();}catch(e){toast('Use Download PDF to print');}},
  onesc:()=>{const r=R.by[ui.scls].list.find(x=>x.k.id===ui.scand);if(r)pdfOut(scoreCardPDF(S,R,[r]),'Score_Card_'+fn(r.k.roll)+'.pdf');},
  allsc:()=>{const l=R.by[ui.scls].list.slice().sort((a,b)=>a.k.roll.localeCompare(b.k.roll));if(l.length)pdfOut(scoreCardPDF(S,R,l),'Score_Cards_'+fn(clsName(ui.scls))+'.pdf');else toast('No candidates');},
  admpdf:()=>{const l=R.by[ui.acls].list.slice().sort((a,b)=>a.k.roll.localeCompare(b.k.roll));if(l.length)pdfOut(admitPDF(S,R,l),'Admit_Cards_'+fn(clsName(ui.acls))+'.pdf');else toast('No candidates');},
  admall:()=>{const p=new PDF();R.order.forEach(c=>{const l=R.by[c].list.slice().sort((a,b)=>a.k.roll.localeCompare(b.k.roll));if(l.length)admitPDF(S,R,l,p);});if(p.pages.length)pdfOut(p,'Admit_Cards_All_Classes.pdf');else toast('No candidates');},
  copysub:()=>{const src=S.classes.find(c=>c.code==='VI');S.classes.forEach(c=>{if(['VII','VIII','IX','X','XI'].includes(c.code))c.subjects=src.subjects.map(s=>({n:s.n,m:s.m}));});save({meta:true});route();toast('Subjects copied');},
  golive:()=>liveStart(true),
  offline:()=>liveStop(false),
  signout:()=>ask('Sign out? This also signs you out of SJS App on this device.',()=>liveStop(true),'Sign out'),
  copyrules:()=>{try{navigator.clipboard.writeText(RULES_TXT).then(()=>toast('Rules copied'),()=>toast('Select the text and copy it'));}catch(e){toast('Select the text and copy it');}},
  bkp:()=>saveFile('SJS_Entrance_Backup_'+todayISO()+'.json',JSON.stringify(S),'application/json'),
  clear:()=>ask('Delete all '+S.cands.length+' candidates and their marks'+(Live.on?' for everyone in SJS App':'')+'? Download a backup first if you may need them.',()=>{S.cands=[];S.seq={};S.sample=false;save({all:true});route();toast('All candidates cleared');},'Delete all candidates'),
  sample:()=>ask('Replace current data with sample candidates'+(Live.on?' for everyone in SJS App':'')+'?',()=>{const tm=!!S.teachersMarks;S=sampleState();S.teachersMarks=tm;save({all:true});route();toast('Sample data loaded');},'Load sample')
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a],[data-go],[data-edit],[data-del],[data-x],[data-adm1]');
  if(e.target.id==='modal'){closeModal();return;}
  if(!t)return;
  if(t.dataset.a&&actions[t.dataset.a]){e.preventDefault();actions[t.dataset.a]();}
  else if(t.dataset.go)location.hash='#'+t.dataset.go;
  else if(t.dataset.edit)candForm(t.dataset.edit);
  else if(t.dataset.x==='close')closeModal();
  else if(t.dataset.adm1){const r=R.all.find(x=>x.k.id===t.dataset.adm1);if(r)pdfOut(admitPDF(S,R,[r]),'Admit_Card_'+fn(r.k.roll)+'.pdf');}
  else if(t.dataset.del){const k=S.cands.find(x=>x.id===t.dataset.del);if(k)ask('Delete '+k.name+' ('+k.roll+') and their marks?',()=>{S.cands=S.cands.filter(x=>x.id!==k.id);save({del:[[k.cls,k.id]]});route();toast('Deleted');},'Delete');}
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;
  const sets={ccls:v=>ui.ccls=v,mcls:v=>ui.cls=v,rcls:v=>ui.rcls=v,rstat:v=>ui.rstat=v,ncls:v=>ui.ncls=v,scls:v=>{ui.scls=v;ui.scand='';},scand:v=>ui.scand=v,acls:v=>ui.acls=v};
  if(sets[id]){sets[id](t.value);route();return;}
  if(id==='tmarks'){if(!Live.mgr)return;S.teachersMarks=t.checked;save({meta:true});toast(t.checked?'Teachers can now enter marks':'Only Admin and Exam In-Charge can enter marks');return;}
  if(['nmarks','nfather','nwait'].includes(id)){ui[id]=t.checked;route();return;}
  if(id==='restore'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const st=normalize(JSON.parse(fr.result));if(!st.classes.length)throw 0;ask('Replace current data with this backup ('+st.cands.length+' candidates)?',()=>{S=st;S.sample=!!st.sample;save({all:true});route();toast('Backup restored');},'Restore');}catch(err){toast('That file is not a valid backup');}};fr.readAsText(t.files[0]);t.value='';return;}
  if(t.dataset.set&&t.tagName==='SELECT'){const [g,n]=t.dataset.set.split('.');S[g][n]=t.value;save({meta:true});toast('Tie rule updated');return;}
  if(t.matches('[data-ab]')&&!canMarks()){t.checked=!t.checked;toast('View only');return;}
  if(t.dataset.set&&!canEdit())return;
  if(t.matches('[data-ab]')){const tr=t.closest('tr'),k=S.cands.find(x=>x.id===tr.dataset.id);k.absent=t.checked;tr.classList.toggle('abs',k.absent);tr.querySelectorAll('[data-m]').forEach(i=>i.disabled=k.absent);save({cands:[k]});refreshMarks();}
});
let setT=null;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'||t.id==='q2'){ui.q=t.value;clearTimeout(setT);setT=setTimeout(()=>{const pos=t.selectionStart,id=t.id;route();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);return;}
  if(t.dataset.m!==undefined&&!canMarks()){toast('View only');return;}
  if((t.dataset.set||t.dataset.cls||t.dataset.sub)&&!canEdit()){toast('View only');return;}
  if(t.dataset.m!==undefined){const tr=t.closest('tr'),k=S.cands.find(x=>x.id===tr.dataset.id),max=+t.dataset.max,v=t.value.trim();
    if(v===''){k.marks[+t.dataset.m]=null;t.classList.remove('bad');}
    else{const n=Number(v);if(isNaN(n)||n<0||n>max){t.classList.add('bad');t.title='Enter 0 to '+max;return;}t.classList.remove('bad');k.marks[+t.dataset.m]=n;}
    clearTimeout(setT);setT=setTimeout(()=>{save({cands:[k]});refreshMarks();},300);return;}
  if(t.dataset.set){const [g,n]=t.dataset.set.split('.');S[g][n]=t.value;clearTimeout(setT);setT=setTimeout(()=>{save({meta:true});header();},400);return;}
  if(t.dataset.cls){const [ci,k]=t.dataset.cls.split('.');const v=Math.max(0,parseInt(t.value,10)||0);S.classes[ci][k]=k==='pass'?Math.min(100,v):v;clearTimeout(setT);setT=setTimeout(()=>save({meta:true}),400);return;}
  if(t.dataset.sub){const [ci,si,k]=t.dataset.sub.split('.');const s=S.classes[ci].subjects[si];if(k==='n')s.n=t.value;else s.m=Math.max(0,parseFloat(t.value)||0);
    const cell=document.querySelector('[data-tot="'+ci+'"] b');if(cell)cell.textContent=S.classes[ci].subjects.reduce((a,x)=>a+(x.n?x.m:0),0);clearTimeout(setT);setT=setTimeout(()=>save({meta:true}),400);}
});
document.addEventListener('keydown',e=>{
  const t=e.target;if(t.dataset&&t.dataset.m!==undefined&&(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp')){
    e.preventDefault();const rows=[...document.querySelectorAll('.mk tbody tr[data-id]')];const i=rows.indexOf(t.closest('tr'));const nx=rows[i+(e.key==='ArrowUp'?-1:1)];
    if(nx){const inp=nx.querySelector('[data-col="'+t.dataset.col+'"]');if(inp&&!inp.disabled){inp.focus();inp.select();}}
  }
  if(e.key==='Escape')closeModal();
});

/* ---------- START ---------- */
S=loadLocal();
if(!S){S=sampleState();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
R=compute(S);
route();paintLive();
let liveFlag=null;try{liveFlag=localStorage.getItem(LIVE_KEY);}catch(e){}
if(liveFlag!=='0')liveStart(false);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}

</script>
</body>
</html>
