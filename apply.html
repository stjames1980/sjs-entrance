<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrance Test Application</title>
<meta name="theme-color" content="#1d3fb8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a school admission office counter — welcoming, plain, trustworthy for parents on a phone
   IDEA: the printed admission form, filled in one calm column
   PICTURE: the form itself and the Application No. receipt
   COLOUR and TYPE: royal blue band, white form, crest red for what matters; Outfit + Inter
   LAYOUT: header band, two tabs (Apply / Check status), one column form up to 720px */
:root{color-scheme:light dark;--bg:light-dark(#f3f5fb,#0b1120);--card:light-dark(#fff,#141c31);--ink:light-dark(#111a33,#e8ecf8);--mute:light-dark(#5a6584,#9aa5c4);--line:light-dark(#dfe4f0,#26304c);--soft:light-dark(#eef2fc,#1a2542);--blue:#1d3fb8;--blueD:light-dark(#142d86,#8fa8ff);--red:#d8342b;--green:light-dark(#12805c,#4cd29f);--greenS:light-dark(#e3f5ed,#123528);--amberS:light-dark(#fff1d6,#3a2a0c);--amber:light-dark(#a35f00,#f2b54b);--redS:light-dark(#fde7e5,#3d1614)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,Segoe UI,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
.hero{background:var(--blue);color:#fff;padding:20px 16px 0;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red)}
.brand{display:flex;gap:14px;align-items:center;max-width:760px;margin:0 auto}
.brand img{width:58px;height:58px;border-radius:50%;background:#fff;padding:3px;object-fit:contain;flex:none}
.brand h1{font-size:clamp(20px,4.5vw,28px)}.brand p{margin:3px 0 0;opacity:.88;font-size:14px}
.tabs{display:flex;gap:4px;max-width:760px;margin:16px auto 0}
.tabs button{all:unset;cursor:pointer;color:#fff;padding:12px 16px;border-radius:10px 10px 0 0;font-weight:600;opacity:.85;min-height:20px}
.tabs button.on{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h2{font-size:24px;margin-bottom:6px}
.muted{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .full{grid-column:1/-1}
@media(max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
label{display:grid;gap:5px;font-size:14px;color:var(--mute);font-weight:500}
label b{color:var(--red)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
textarea{min-height:80px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{border:0;border-radius:12px;padding:12px 18px;min-height:48px;font:600 16px Inter,sans-serif;cursor:pointer;background:var(--soft);color:var(--blueD)}
.btn.pri{background:var(--blue);color:#fff}.btn:disabled{opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ph{display:flex;gap:14px;align-items:center}.ph img{width:84px;height:105px;object-fit:cover;border-radius:10px;background:var(--soft)}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.ok{background:var(--greenS);color:var(--green)}.warn{background:var(--amberS);color:var(--amber)}.bad{background:var(--redS);color:var(--red)}.info{background:var(--soft);color:var(--blueD)}
.appno{font:700 clamp(30px,8vw,44px)/1.1 Outfit,sans-serif;color:var(--red);letter-spacing:.06em;margin:6px 0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:12px 0}
.kv div small{display:block;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase}
.big{font:700 22px Outfit,sans-serif}
.chk{width:22px;height:22px;min-height:0;flex:none}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111a33;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>

<nav class="tabs"><button data-t="apply" class="on">Apply online</button><button data-t="status">Status &amp; admit card</button></nav></header>

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
async function init(){
  $('#hLogo').src='data:image/jpeg;base64,'+LOGO_B64;
  try{const b='https://www.gstatic.com/firebasejs/10.12.2/';await loadScript(b+'firebase-app-compat.js');await loadScript(b+'firebase-firestore-compat.js');
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);fs=firebase.firestore();
    const d=await fs.collection('entrance_public').doc('info').get();info=d.exists?d.data():null;}
  catch(e){info=null;render('<div class="banner bad">Could not connect. Please check the internet and reload this page.</div>');return;}
  if(info){$('#hName').textContent=title(info.school.name);$('#hSub').textContent=info.test.title+' '+info.test.session+' — online application';}
  render();
}
const title=s=>String(s||'').replace(/\b(\w)(\w*)/g,(m,a,b)=>a+b.toLowerCase()).replace(/H\.s\./i,'H.S.');
function render(msg){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(msg){$('#app').innerHTML=msg;return;}
  $('#app').innerHTML=tab==='apply'?vApply():vStatus();
}
function mine(){try{return JSON.parse(localStorage.getItem(MINE)||'[]');}catch(e){return [];}}
function vApply(){
  if(!info)return '<div class="card"><h2>Applications are not open</h2><p class="muted">The school has not opened online applications yet. Please check again later or contact the school office.</p></div>';
  const closed=!info.open||(info.last&&info.last<new Date().toISOString().slice(0,10));
  const my=mine();
  const myList=my.length?`<div class="card"><h3>Applied from this phone</h3>${my.map(m=>`<p style="margin:8px 0"><b>${esc(m.id)}</b> — ${esc(m.name)} (${esc(m.cls)}) <button class="btn" style="min-height:36px;padding:6px 12px;font-size:14px" data-chk="${esc(m.id)}" data-dob="${esc(m.dob)}">Check status</button></p>`).join('')}</div>`:'';
  if(closed)return `<div class="card"><h2>Online applications are closed</h2><p class="muted">${info.last?'The last date was '+esc(fmtDate(info.last))+'. ':''}You can still check the status of a form you already sent.</p><button class="btn pri" data-t2="status">Check status</button></div>`+myList;
  const cls=info.classes.map(c=>`<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('');
  return `<div class="card"><h2>${esc(info.test.title)} ${esc(info.test.session)}</h2>
   <p class="muted" style="margin:0">Test date <b>${esc(fmtDate(info.test.date))}</b>${info.last?' · Last date to apply <b>'+esc(fmtDate(info.last))+'</b>':''} · Venue ${esc(info.test.venue)}</p>
   ${info.note?`<div class="banner info" style="margin:14px 0 0">${esc(info.note)}</div>`:''}</div>
  <form class="card" id="af" novalidate><h3 style="margin-bottom:14px">Candidate details</h3><div class="grid">
   <label><span>Class applied for <b>*</b></span><select name="cls" required><option value="">Choose class</option>${cls}</select></label>
   <label id="strw" style="display:none">Stream (Class XI)<select name="stream"><option value="">Choose</option><option>Science</option><option>Arts</option><option>Commerce</option></select></label>
   <label class="full"><span>Candidate's full name <b>*</b></span><input name="name" required maxlength="80" autocomplete="off"></label>
   <label><span>Gender <b>*</b></span><select name="gender" required><option value="">Choose</option><option>Male</option><option>Female</option><option>Other</option></select></label>
   <label><span>Date of birth <b>*</b></span><input name="dob" type="date" required></label>
   <label><span>Father's name <b>*</b></span><input name="father" required maxlength="80"></label>
   <label>Mother's name<input name="mother" maxlength="80"></label>
   <label><span>Mobile number (WhatsApp) <b>*</b></span><input name="phone" type="tel" inputmode="numeric" required maxlength="15" placeholder="10-digit number"></label>
   <label>Category<select name="category"><option>General</option><option>ST</option><option>SC</option><option>OBC</option><option>Other</option></select></label>
   <label class="full">Address / Village<input name="address" maxlength="200"></label>
   <label class="full">Previous school (if any)<input name="prev" maxlength="100"></label>
   <div class="full ph"><img id="phPrev" alt="" style="display:none"><label style="flex:1">Recent passport photo (optional)<input type="file" id="phIn" accept="image/*"></label></div>
   <label class="full row" style="color:var(--ink);font-weight:400;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" class="chk" id="decl"> <span>I declare that the details given are true. I will bring the original documents at the time of admission.</span></label>
  </div><p id="err" style="color:var(--red);min-height:1.3em;margin:12px 0 4px"></p><button class="btn pri" type="submit" style="width:100%">Submit application</button></form>`+myList;
}
function vStatus(){
  return `<div class="card"><h2>Check status / admit card</h2><p class="muted">Enter the Application No. you received after applying and the child's date of birth.</p>
   <div class="grid" style="margin-top:12px"><label>Application No.<input id="sNo" value="${esc(last?last.id:'')}" autocapitalize="characters" placeholder="e.g. E7K2QX9M"></label><label>Date of birth<input id="sDob" type="date" value="${esc(last?last.dob:'')}"></label></div>
   <p id="sErr" style="color:var(--red);min-height:1.3em;margin:10px 0"></p><button class="btn pri" id="sGo" style="width:100%">Check</button></div><div id="sRes">${last&&last.doc?resultCard(last.doc):''}</div>`;
}
function resultCard(a){
  const head=`<div class="kv"><div><small>Application No.</small><b>${esc(a.id)}</b></div><div><small>Candidate</small><b>${esc(a.name)}</b></div><div><small>Class</small>${esc(clsN(a.cls))}${a.stream?' ('+esc(a.stream)+')':''}</div><div><small>Father</small>${esc(a.father||'')}</div></div>`;
  if(a.status==='accepted'){const sc=a.sched||{};return `<div class="card"><div class="banner ok"><b>Application accepted.</b> Please download and print the admit card.</div>${head}
    <div class="kv"><div><small>Roll No.</small><span class="big" style="color:var(--red)">${esc(a.roll||'')}</span></div><div><small>Room / Seat</small><span class="big">${a.room?esc(a.room)+' / '+esc(a.seat):'To be announced'}</span></div>
    <div><small>Test date</small>${esc(fmtDate(sc.date||info.test.date))}</div><div><small>Reporting time</small>${esc(sc.report||info.test.reporting)}</div><div><small>Test time</small>${esc(sc.time||info.test.time)}</div><div><small>Venue</small>${esc(info.test.venue)}</div></div>
    <button class="btn pri" data-adm style="width:100%">Download admit card (PDF)</button></div>`;}
  if(a.status==='rejected')return `<div class="card"><div class="banner bad"><b>Application not accepted.</b>${a.reason?' Reason: '+esc(a.reason):''}</div>${head}<p class="muted">Please contact the school office for help.</p></div>`;
  return `<div class="card"><div class="banner warn"><b>Received — under scrutiny.</b> Please check again later. The admit card will be available here once the form is accepted.</div>${head}<button class="btn" data-ack style="width:100%">Download acknowledgement (PDF)</button></div>`;
}
const clsN=c=>((info&&info.classes||[]).find(x=>x.code===c)||{}).name||c;
function S0(){const sc=info.sched||{};return {school:Object.assign({name:'',motto:'',address:'',affil:'',email:'',phone:''},info.school),test:Object.assign({},info.test),sched:sc,exam:{}};}
function dl(name,bytes){const b=new Blob([bytes],{type:'application/pdf'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},8000);toast('Downloading '+name);}
function admitCard(a){const S=S0();if(a.sched)S.sched=Object.assign({},S.sched,{[a.cls]:a.sched});
  PHOTOS={};if(a.photo)PHOTOS[a.id]=a.photo;
  const r={k:{id:a.id,roll:a.roll||'',name:a.name,father:a.father||'',mother:a.mother||'',dob:a.dob||'',gender:a.gender||'',form:a.id,stream:a.stream||'',phone:a.phone||''},cls:{code:a.cls,name:a.clsName||clsN(a.cls)}};
  const plan={by:{}};if(a.room)plan.by[a.id]={room:{name:a.room},seat:a.seat};
  const p=admitPDF(S,null,[r],null,plan,2);dl('Admit_Card_'+(a.roll||a.id)+'.pdf',p.output());}
function ackPDF(a){const S=S0();PHOTOS={};if(a.photo)PHOTOS[a.id]=a.photo;const p=new PDF();p.add();
  let y=pdfHeader(p,S,'APPLICATION ACKNOWLEDGEMENT',S.test.title+' '+S.test.session);
  p.rect(ML,y,523,64,{fill:C.soft,r:10});p.text('APPLICATION NO.',ML+16,y+20,{size:8,bold:true,color:C.mute});p.text(a.id,ML+16,y+48,{size:26,bold:true,color:C.red});
  y+=82;
  const rows=[['Class applied for',clsN(a.cls)+(a.stream?' ('+a.stream+')':'')],["Candidate's name",a.name],['Gender',a.gender||'-'],['Date of birth',fmtDMY(a.dob)],["Father's name",a.father||'-'],["Mother's name",a.mother||'-'],['Mobile',a.phone||'-'],['Category',a.category||'-'],['Address',a.address||'-'],['Previous school',a.prev||'-'],['Submitted on',a.at&&a.at.toDate?a.at.toDate().toLocaleString():new Date().toLocaleString()]];
  if(a.photo)p.photo(a.id,ML+523-96,y,96,120);
  rows.forEach((e,i)=>{p.text(e[0].toUpperCase(),ML,y+i*26,{size:7.5,bold:true,color:C.mute});p.text(e[1],ML,y+i*26+12,{size:10.5,bold:i===1,maxW:a.photo?400:523});});
  y+=rows.length*26+16;
  y=p.para('Keep this Application No. safe. Check the status and download the admit card at stjames1980.github.io/sjs-entrance/apply.html using the Application No. and the date of birth. Bring the original documents at the time of admission.',ML,y,523,{size:9,lh:13,color:C.ink});
  pdfFooter(p,S);dl('Application_'+a.id+'.pdf',p.output());}
function genId(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='E';const r=new Uint32Array(8);crypto.getRandomValues(r);for(let i=0;i<8;i++)s+=A[r[i]%A.length];return s;}
function readPhoto(file,cb){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=PHOTO_W;c.height=PHOTO_H;const x=c.getContext('2d');const r=Math.max(PHOTO_W/img.width,PHOTO_H/img.height),w=img.width*r,h=img.height*r;x.fillStyle='#fff';x.fillRect(0,0,PHOTO_W,PHOTO_H);x.drawImage(img,(PHOTO_W-w)/2,(PHOTO_H-h)/2,w,h);cb(c.toDataURL('image/jpeg',0.82));};img.onerror=()=>toast('That file is not a picture');img.src=fr.result;};fr.readAsDataURL(file);}
async function submit(f){
  if(busy)return;const d=Object.fromEntries(new FormData(f).entries());Object.keys(d).forEach(k=>d[k]=String(d[k]).trim());
  const err=m=>{$('#err').textContent=m;};
  if(!d.cls)return err('Choose the class.');if(d.name.length<2)return err("Type the candidate's full name.");if(!d.gender)return err('Choose the gender.');if(!d.dob)return err('Enter the date of birth.');
  if(!d.father)return err("Type the father's name.");d.phone=d.phone.replace(/[^\d+]/g,'');if(d.phone.replace(/\D/g,'').length<10)return err('Type a 10-digit mobile number.');
  if(d.cls!=='XI')d.stream='';if(!$('#decl').checked)return err('Please tick the declaration.');
  const doc={name:d.name,cls:d.cls,gender:d.gender,dob:d.dob,father:d.father,mother:d.mother||'',phone:d.phone,address:d.address||'',category:d.category||'General',prev:d.prev||'',stream:d.stream||'',status:'new',at:firebase.firestore.FieldValue.serverTimestamp()};
  if(photo)doc.photo=photo;
  busy=true;f.querySelector('button[type=submit]').disabled=true;err('Sending…');
  try{const id=genId();await fs.collection('entrance_apply').doc(id).set(doc);
    const m=mine();m.unshift({id,name:d.name,cls:clsN(d.cls),dob:d.dob});try{localStorage.setItem(MINE,JSON.stringify(m.slice(0,10)));}catch(e){}
    const a=Object.assign({},doc,{id,at:null});
    $('#app').innerHTML=`<div class="card" style="text-align:center"><div class="banner ok" style="text-align:left"><b>Application sent.</b> Thank you. The school will check the form.</div><p class="muted" style="margin:14px 0 0">Your Application No.</p><div class="appno">${esc(id)}</div><p class="muted">Write it down or take a screenshot. You need it with the date of birth to check the status and download the admit card.</p>
      <div class="row" style="justify-content:center"><button class="btn pri" id="ackBtn">Download acknowledgement</button><button class="btn" id="cpBtn">Copy number</button><button class="btn" data-t2="status">Check status</button></div></div>`;
    $('#ackBtn').onclick=()=>ackPDF(a);$('#cpBtn').onclick=()=>{try{navigator.clipboard.writeText(id).then(()=>toast('Copied'));}catch(e){toast(id);}};
    photo='';last={id,dob:d.dob};
  }catch(e){err(e&&e.code==='permission-denied'?'Online applications are closed or a detail is too long. Please check and try again.':'Could not send. Check the internet and try again.');f.querySelector('button[type=submit]').disabled=false;}
  busy=false;
}
async function check(no,dob){
  no=String(no||'').trim().toUpperCase();const er=$('#sErr');
  if(!no||!dob){er.textContent='Type the Application No. and choose the date of birth.';return;}
  er.textContent='Checking…';
  try{const d=await fs.collection('entrance_apply').doc(no).get();if(!d.exists||d.data().dob!==dob){er.textContent='No application found with that number and date of birth.';$('#sRes').innerHTML='';return;}
    const a=Object.assign({id:no},d.data());last={id:no,dob,doc:a};er.textContent='';$('#sRes').innerHTML=resultCard(a);}
  catch(e){er.textContent='Could not check. Please try again.';}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-t2],[data-chk],[data-adm],[data-ack],#sGo');if(!t)return;
  if(t.dataset.t||t.dataset.t2){tab=t.dataset.t||t.dataset.t2;render();return;}
  if(t.dataset.chk){tab='status';last={id:t.dataset.chk,dob:t.dataset.dob};render();check(t.dataset.chk,t.dataset.dob);return;}
  if(t.id==='sGo'){check($('#sNo').value,$('#sDob').value);return;}
  if(t.dataset.adm!==undefined&&last&&last.doc){admitCard(last.doc);return;}
  if(t.dataset.ack!==undefined&&last&&last.doc){ackPDF(last.doc);return;}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.name==='cls'){$('#strw').style.display=t.value==='XI'?'':'none';}
  if(t.id==='phIn'&&t.files[0])readPhoto(t.files[0],d=>{photo=d;const im=$('#phPrev');im.src=d;im.style.display='';});
});
document.addEventListener('submit',e=>{if(e.target.id==='af'){e.preventDefault();submit(e.target);}});
init();
}

</script>
</body>
</html>
